<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sanzekai | Contact</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .glass-nav { 
            background: rgba(15, 23, 42, 0.7); 
            backdrop-filter: blur(12px); 
            -webkit-backdrop-filter: blur(12px);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-200 min-h-screen flex flex-col selection:bg-blue-500 selection:text-white">

    <div id="header-placeholder"></div>

    <main class="flex-grow max-w-5xl mx-auto px-6 pt-32 pb-20 w-full relative">
        
        <div class="absolute top-40 right-10 bg-blue-600/10 w-80 h-80 rounded-full blur-3xl -z-10"></div>

        <div class="mb-12 border-l-4 border-blue-500 pl-5 flex flex-col gap-2">
            <h1 class="text-4xl md:text-5xl font-extrabold tracking-tight text-white">
                Get In <span class="text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-emerald-400">Touch</span>
            </h1>
            <p class="text-slate-400 text-sm mt-1">Punya pertanyaan, ajakan kolaborasi, atau sekadar mau menyapa? Kirim pesanmu di bawah.</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-10 relative z-10">
            
            <div class="flex flex-col gap-6">
                <div class="bg-slate-900/50 p-6 rounded-2xl border border-slate-800/60 flex items-start gap-4">
                    <div class="p-3 bg-blue-500/10 text-blue-400 rounded-xl">
                        <i class="fa-solid fa-envelope text-lg"></i>
                    </div>
                    <div>
                        <h3 class="text-white font-semibold mb-1">Email</h3>
                        <p class="text-slate-400 text-sm break-all">mohihsanseptianof@gmail.com</p>
                        <p class="text-slate-400 text-sm break-all">ihsnzyan@it.student.pens.ac.id</p>
                    </div>
                </div>

                <div class="bg-slate-900/50 p-6 rounded-2xl border border-slate-800/60 flex items-start gap-4">
                    <div class="p-3 bg-emerald-500/10 text-emerald-400 rounded-xl">
                        <i class="fa-solid fa-location-dot text-lg"></i>
                    </div>
                    <div>
                        <h3 class="text-white font-semibold mb-1">Lokasi</h3>
                        <p class="text-slate-400 text-sm">Kab. Gresik, Indonesia</p>
                    </div>
                </div>
            </div>

            <div class="md:col-span-2 bg-slate-900/80 backdrop-blur-sm p-8 rounded-2xl border border-slate-800">
                <form id="contactForm" class="flex flex-col gap-5">
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                        <div class="flex flex-col gap-2">
                            <label for="name" class="text-xs font-semibold uppercase tracking-wider text-slate-400">Nama</label>
                            <input type="text" id="name" required class="bg-slate-950/60 border border-slate-800 focus:border-blue-500 rounded-xl px-4 py-3 text-sm text-white placeholder-slate-600 focus:outline-none transition-colors" placeholder="Namamu (isi '-' jika anonim)">
                        </div>
                        <div class="flex flex-col gap-2">
                            <label for="email" class="text-xs font-semibold uppercase tracking-wider text-slate-400">Email</label>
                            <input type="text" id="email" required class="bg-slate-950/60 border border-slate-800 focus:border-blue-500 rounded-xl px-4 py-3 text-sm text-white placeholder-slate-600 focus:outline-none transition-colors" placeholder="Emailmu (isi '-' jika anonim)">
                        </div>
                    </div>
                    <div class="flex flex-col gap-2">
                        <label for="subject" class="text-xs font-semibold uppercase tracking-wider text-slate-400">Subjek</label>
                        <input type="text" id="subject" required class="bg-slate-950/60 border border-slate-800 focus:border-blue-500 rounded-xl px-4 py-3 text-sm text-white placeholder-slate-600 focus:outline-none transition-colors" placeholder="Ada keperluan apa?">
                    </div>
                    <div class="flex flex-col gap-2">
                        <label for="message" class="text-xs font-semibold uppercase tracking-wider text-slate-400">Pesan</label>
                        <textarea id="message" rows="5" required class="bg-slate-950/60 border border-slate-800 focus:border-blue-500 rounded-xl px-4 py-3 text-sm text-white placeholder-slate-600 focus:outline-none transition-colors resize-none" placeholder="Tulis aduan atau pesanmu di sini..."></textarea>
                    </div>
                    
                    <button type="submit" id="submitBtn" class="bg-blue-600 hover:bg-blue-500 text-white font-semibold px-6 py-3.5 rounded-xl transition-all shadow-lg shadow-blue-900/20 flex items-center justify-center gap-2 mt-2">
                        <span id="btnText">Kirim Pesan</span> 
                        <i id="btnIcon" class="fa-solid fa-paper-plane text-xs"></i>
                    </button>
                </form>

                <div id="statusMessage" class="hidden mt-4 p-4 rounded-xl text-sm font-semibold text-center"></div>
            </div>

        </div>
    </main>

    <div id="footer-placeholder"></div>

    <script src="/assets/script.js"></script>

<script>
        document.getElementById('contactForm').addEventListener('submit', async function(e) {
            e.preventDefault();
    
            const submitBtn = document.getElementById('submitBtn');
            const btnText = document.getElementById('btnText');
            const btnIcon = document.getElementById('btnIcon');
            const statusMessage = document.getElementById('statusMessage');
    
            // Ambil data input
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const subject = document.getElementById('subject').value;
            const message = document.getElementById('message').value;
    
            const API_URL = "https://script.google.com/macros/s/AKfycbyKeHvind0auIX3LrXj01zxfWX5LLXSLB4-2T4R-AgSTrY99CKWC9iBYhHTmW7ffb6_/exec"; 
    
            // Set UI Loading
            submitBtn.disabled = true;
            btnText.innerText = "Mengirim...";
            btnIcon.className = "fa-solid fa-spinner fa-spin text-xs";
            statusMessage.classList.add('hidden');
    
            try {
                // Tembak data ke Google Script API
                await fetch(API_URL, {
                    method: 'POST',
                    mode: 'no-cors', // WAJIB ADA BIAR GAK KENA BLOKIR CORS!
                    headers: { 
                        'Content-Type': 'text/plain;charset=utf-8' // WAJIB text/plain
                    },
                    body: JSON.stringify({ name, email, subject, message })
                });
    
                // Sukses (karena pakai no-cors, kita asumsikan sukses kalau gak masuk catch)
                statusMessage.innerText = "Aduan masuk, terima kasih!";
                statusMessage.className = "mt-4 p-4 rounded-xl text-sm font-semibold text-center bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 block";
                e.target.reset(); // Kosongkan form
    
            } catch (error) {
                // Gagal
                statusMessage.innerText = "Gagal mengirim aduan. Coba lagi.";
                statusMessage.className = "mt-4 p-4 rounded-xl text-sm font-semibold text-center bg-red-500/20 text-red-400 border border-red-500/30 block";
                console.error("Error:", error);
            } finally {
                // Restore UI kembali seperti semula
                submitBtn.disabled = false;
                btnText.innerText = "Kirim Pesan";
                btnIcon.className = "fa-solid fa-paper-plane text-xs";
            }
        });
    </script>
